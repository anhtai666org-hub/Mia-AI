name: Mia Render Keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Mia service
        run: |
          curl --fail --silent --show-error --max-time 60 https://ruan-ruan-ren-gong-zhi-neng.onrender.com/health || curl --fail --silent --show-error --max-time 60 https://ruan-ruan-ren-gong-zhi-neng.onrender.com/ || true
