<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff0f6"><title>みあ — Mia AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<header class="app-header"><button id="historyBtn" class="round-head history-head-icon" aria-label="Lịch sử chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9a2.5 2.5 0 0 1-2.5 2.5H9l-5 3V5.5Z"/><path d="M8 8h8M8 11.5h5"/></svg></button><a class="brand centered-brand" href="#" aria-label="Mia AI"><span>Mia <small>みあ</small></span></a><button id="menu" class="round-head" aria-label="Mở tùy chọn">☰</button></header>
<main><aside id="drawer"><div class="sheet-handle drawer-handle" aria-label="Kéo để đóng"></div><button id="new" class="new-chat">＋　Cuộc trò chuyện mới</button><h4>GẦN ĐÂY</h4><div id="history"></div><div class="side-bottom"><button class="side" data-page="memory">♡　Bộ nhớ</button><button class="side" data-page="settings">⚙　Tùy chọn</button></div></aside><section id="page"></section></main>
<div id="historyBackdrop" class="panel-backdrop"></div><div id="optionsBackdrop" class="panel-backdrop"></div>
<section id="optionsSheet" class="options-sheet" aria-hidden="true"><div class="sheet-handle"></div><div class="option-account" id="optionAccount"></div><div class="option-section"><h4>Diện mạo</h4><div class="option-card"><div class="option-line"><span class="option-symbol">◐</span><span>Chủ đề</span><div class="theme-quick"><button id="customTheme">Tùy chỉnh</button><button id="lightTheme">Sáng</button><button id="darkTheme">Tối</button></div></div><button class="option-line" id="optionBackground"><span class="option-symbol">▧</span><span>Nền</span><span class="chevron">›</span></button><button class="option-line" id="optionView"><span class="option-symbol">☷</span><span>Xem</span><span class="chevron">›</span></button></div></div><div class="option-section"><h4>Âm thanh</h4><div class="option-card"><div class="option-line"><span class="option-symbol">◖</span><input id="soundRange" type="range" min="0" max="100" value="0" aria-label="Âm lượng"></div><button class="option-line" id="optionListen"><span class="option-symbol">♬</span><span>Nghe</span><span class="chevron">›</span></button></div></div><div class="option-section"><h4>Ứng dụng</h4><div class="option-card"><button class="option-line" id="optionSettings"><span class="option-symbol">⚙</span><span>Cài đặt</span><span class="chevron">›</span></button><button class="option-line" id="optionAbout"><span class="option-symbol">ⓘ</span><span>Giới thiệu</span><span class="chevron">›</span></button></div></div></section>

<div id="toast" aria-hidden="true"></div><input id="file" type="file" hidden><div id="lightbox"><button id="lightbox-close">×</button><img id="lightbox-img" alt="Xem ảnh"></div>
<script src="/app.js"></script>
</body></html>
