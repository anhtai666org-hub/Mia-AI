<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>Mia AI · v2</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="app">
<aside class="rail"><button class="brand" id="home" title="Mia AI">m<span>i</span>a</button><button id="newChat" class="railbtn active" title="Chat mới">＋</button><button id="openHistory" class="railbtn" title="Lịch sử">◷</button><button id="openMenu" class="railbtn" title="Menu">☰</button><div class="railbottom"><button id="accountBtn" class="avatar">ĐN</button></div></aside>
<main class="main">
<section class="chat" id="chat"><div class="welcome" id="welcome"><div class="orb">m</div><h1>Chào cậu, mình là Mia.</h1><p>Hôm nay cậu muốn khám phá điều gì?</p><div class="suggestions"><button data-prompt="Giải thích một điều thú vị về vũ trụ">✦ Điều thú vị về vũ trụ</button><button data-prompt="Giúp mình lên ý tưởng sáng tạo">✧ Lên ý tưởng sáng tạo</button><button data-prompt="Hướng dẫn mình học một kỹ năng mới">↗ Học kỹ năng mới</button></div></div><div id="messages" class="messages"></div></section>
<div class="composerwrap"><div class="composer"><textarea id="input" rows="1" placeholder="Nhắn tin cho Mia..." maxlength="12000"></textarea><div class="composerfoot"><div class="tools"><label class="iconbtn attach" title="Đính kèm ảnh"><input id="file" type="file" accept="image/*" hidden>＋</label><span id="filelabel"></span></div><button id="send" class="send" title="Gửi">↑</button></div></div><p class="disclaimer">Mia có thể mắc lỗi. Hãy kiểm tra thông tin quan trọng.</p></div></main>
<div class="scrim" id="scrim"></div><section class="drawer" id="drawer" aria-hidden="true"><div class="drawerhead"><strong id="drawerTitle">Lịch sử</strong><button class="iconbtn close" id="closeDrawer">×</button></div><div id="drawerBody" class="drawerbody"></div></section>
<div class="toast" id="toast"></div></div><script src="app.js"></script></body></html>
