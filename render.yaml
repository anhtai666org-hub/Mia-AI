services:
  - type: web
    name: AI Project Mia AI
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: Gemini-3.5-flast-lite
      - key: SESSION_SECRET
        generateValue: true
